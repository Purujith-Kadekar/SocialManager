<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="shieldFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7E57C2"/>
      <stop offset="50%" stop-color="#5838B8"/>
      <stop offset="100%" stop-color="#4527A0"/>
    </linearGradient>
    <linearGradient id="lockFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E0E0E0"/>
    </linearGradient>
  </defs>
  <!-- Amber accent at top peak (matches the small yellow dot in brand icons) -->
  <circle cx="128" cy="22" r="6" fill="#FFD166"/>
  <!-- Shield body -->
  <path d="M128 24 L208 56 L208 132 C208 184 176 216 128 232 C80 216 48 184 48 132 L48 56 Z"
        fill="url(#shieldFill)" stroke="#311B92" stroke-width="2"/>
  <!-- Padlock body -->
  <rect x="96" y="120" width="64" height="52" rx="6" fill="url(#lockFill)" stroke="#1A1A1A" stroke-width="1.5"/>
  <!-- Padlock shackle -->
  <path d="M108 120 L108 104 C108 92 116 84 128 84 C140 84 148 92 148 104 L148 120"
        fill="none" stroke="url(#lockFill)" stroke-width="8" stroke-linecap="round"/>
  <!-- Keyhole -->
  <circle cx="128" cy="142" r="5" fill="#1A1A1A"/>
  <rect x="125" y="146" width="6" height="14" rx="1.5" fill="#1A1A1A"/>
</svg>
